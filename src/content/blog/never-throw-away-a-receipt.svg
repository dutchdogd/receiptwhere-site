<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">From a faded receipt to a clear record</title>
  <desc id="d">On the left, a crumpled paper receipt whose print is fading away. An amber arrow points to a phone on the right, which shows the same purchase as a clear record with a green check mark.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5568" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#4A5568" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4A5568" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#12233D" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#F4F6F9"/>
  <circle cx="1060" cy="90" r="190" fill="#FCEBCF" opacity="0.6"/>
  <circle cx="120" cy="590" r="160" fill="#E6EAF0"/>

  <!-- Faded paper receipt -->
  <g transform="translate(190 95) rotate(-6 150 220)" filter="url(#shadow)">
    <path d="M0 0 H300 V420 l-15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 -15 14 -15 -14 Z" fill="#FFFFFF"/>
    <path d="M40 20 C120 60 160 10 260 48" stroke="#E6EAF0" stroke-width="3" fill="none"/>
    <path d="M30 230 C110 200 200 260 280 222" stroke="#E6EAF0" stroke-width="3" fill="none"/>
    <g fill="url(#fade)">
      <rect x="90" y="40" width="120" height="12" rx="3"/>
      <rect x="110" y="62" width="80" height="8" rx="3"/>
      <rect x="40" y="105" width="140" height="9" rx="3"/>
      <rect x="220" y="105" width="40" height="9" rx="3"/>
      <rect x="40" y="130" width="110" height="9" rx="3"/>
      <rect x="220" y="130" width="40" height="9" rx="3"/>
      <rect x="40" y="155" width="150" height="9" rx="3"/>
      <rect x="220" y="155" width="40" height="9" rx="3"/>
      <rect x="40" y="200" width="90" height="9" rx="3" opacity="0.6"/>
      <rect x="210" y="200" width="50" height="9" rx="3" opacity="0.6"/>
      <rect x="40" y="225" width="60" height="9" rx="3" opacity="0.5"/>
      <rect x="220" y="225" width="40" height="9" rx="3" opacity="0.5"/>
      <rect x="40" y="262" width="110" height="12" rx="3" opacity="0.4"/>
      <rect x="200" y="262" width="60" height="12" rx="3" opacity="0.4"/>
      <rect x="40" y="320" width="220" height="7" rx="3" opacity="0.25"/>
      <rect x="40" y="338" width="180" height="7" rx="3" opacity="0.2"/>
    </g>
    <text x="150" y="395" text-anchor="middle" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="26" fill="#4A5568" opacity="0.18">?? . ??</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(560 300)">
    <path d="M0 15 H92" stroke="#F2A93B" stroke-width="14" stroke-linecap="round"/>
    <path d="M78 -12 L112 15 L78 42" stroke="#F2A93B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Phone with a clear record -->
  <g transform="translate(760 70)" filter="url(#shadow)">
    <rect width="270" height="500" rx="40" fill="#12233D"/>
    <rect x="16" y="18" width="238" height="464" rx="28" fill="#FFFFFF"/>
    <rect x="105" y="30" width="60" height="8" rx="4" fill="#E6EAF0"/>

    <rect x="36" y="62" width="198" height="20" rx="6" fill="#12233D"/>
    <rect x="36" y="94" width="120" height="10" rx="5" fill="#C5CEDB"/>

    <rect x="36" y="130" width="198" height="210" rx="16" fill="#F4F6F9"/>
    <rect x="56" y="152" width="70" height="9" rx="4" fill="#C5CEDB"/>
    <text x="56" y="205" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="38" font-weight="600" fill="#12233D">31.41</text>
    <rect x="56" y="228" width="158" height="1.5" fill="#E6EAF0"/>
    <rect x="56" y="244" width="60" height="8" rx="4" fill="#C5CEDB"/>
    <rect x="164" y="244" width="50" height="8" rx="4" fill="#4A5568"/>
    <rect x="56" y="266" width="70" height="8" rx="4" fill="#C5CEDB"/>
    <rect x="154" y="266" width="60" height="8" rx="4" fill="#4A5568"/>
    <rect x="56" y="288" width="50" height="8" rx="4" fill="#C5CEDB"/>
    <rect x="174" y="288" width="40" height="8" rx="4" fill="#4A5568"/>

    <circle cx="207" cy="160" r="18" fill="#E7F4EC"/>
    <path d="M198 160 l6 6 l12 -13" stroke="#1E5B36" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="36" y="364" width="198" height="44" rx="12" fill="#F2A93B"/>
    <rect x="86" y="381" width="98" height="10" rx="5" fill="#12233D" opacity="0.85"/>
    <rect x="36" y="424" width="198" height="12" rx="6" fill="#E6EAF0"/>
    <rect x="36" y="446" width="140" height="12" rx="6" fill="#E6EAF0"/>
  </g>
</svg>
